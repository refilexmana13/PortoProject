plugins {
    id 'java'
}

group = 'org.Refi'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Cucumber untuk JUnit 4
    testImplementation 'io.cucumber:cucumber-junit:7.15.0'
    testImplementation 'io.cucumber:cucumber-java:7.15.0'

    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.seleniumhq.selenium:selenium-java:4.40.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.3.3'

    testImplementation 'io.github.cdimascio:dotenv-java:3.0.0'
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.21.0'

}

test {
    useJUnit()
}

tasks.register('regressionTest', Test) {
    useJUnit()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperties("cucumber.filter.tags": "@regression")

    outputs.upToDateWhen { false}
}

tasks.register('smokeTest', Test) {
    useJUnit()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperties("cucumber.filter.tags": "@smoke")

    outputs.upToDateWhen { false}
}